name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot
        run: |
          mkdir -p ~/.local/share/godot ~/.config
          if [ "$HOME" != "/root" ]; then
            cp -r /root/.config/godot ~/.config/ || true
            cp -r /root/.local/share/godot/export_templates ~/.local/share/godot/ || true
          fi
          ls ~/.local/share/godot/export_templates
      - name: Import project
        run: godot --headless --verbose --import || true
      - name: Export APK
        run: |
          mkdir -p build
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $PWD/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          godot --headless --verbose --export-debug "Android" build/StreetRacer.apk
          ls -la build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreetRacer-apk
          path: build/StreetRacer.apk
      - name: Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/StreetRacer.apk
