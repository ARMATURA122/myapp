name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/

      - name: Debug keystore and editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$PWD/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          JAVA_DIR=$(dirname $(dirname $(readlink -f $(which javac))))
          SDK_DIR=${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}
          mkdir -p ~/.config/godot
          for f in editor_settings-4.3.tres editor_settings-4.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/android_sdk_path = \"$SDK_DIR\""
              echo "export/android/java_sdk_path = \"$JAVA_DIR\""
              echo "export/android/debug_keystore = \"$PWD/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > ~/.config/godot/$f
          done

      - name: Import project
        run: godot --headless --import || true

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/StreetRacer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StreetRacer-apk
          path: build/StreetRacer.apk
